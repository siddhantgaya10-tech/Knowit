    const pct=score/qs.length,msg=pct===1?"Perfect. You know "+quiz.ownerName+" better than anyone.":pct>=.7?"Great — you're a close friend.":pct>=.4?"Not bad. You know the basics.":"Time to hang out more.";
    mount(h("div",{class:"stack",style:"max-width:620px;margin:20px auto"},
      h("div",{class:"card",style:"text-align:center"},h("p",{class:"muted"},name+", you scored"),h("div",{class:"bigscore"},score+"/"+qs.length),h("p",{style:"font-weight:600;margin-top:12px"},msg),
        h("div",{class:"row",style:"justify-content:center"},h("button",{class:"btn",onclick:()=>{i=0;answers.length=0;start()}},"Try again"),h("button",{class:"btn pri",onclick:()=>share(id,quiz.title)},"Challenge a friend"))),
      board.length&&h("div",{class:"card"},h("h3",{},"Leaderboard"),h("table",{},...board.slice(0,10).map((r,k)=>h("tr",{},h("td",{},k+1),h("td",{},r.name),h("td",{style:"text-align:right;font-weight:600"},r.score+"/"+r.total))))),
      h("div",{class:"card",style:"background:var(--yellow)"},h("h3",{},"Now make your own"),h("p",{},"See how well your friends know you."),h("a",{class:"btn dark",href:user?"#/new":"#/signup"},"Create a quiz"))));
  };
  start();
}

    const q=s.data(),rs=(await getDocs(collection(db,"quizzes",id,"results"))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.score-a.score||(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
    const avg=rs.length?(rs.reduce((a,r)=>a+r.score,0)/rs.length).toFixed(1):"–";
    mount(h("div",{class:"stack"},
      h("div",{class:"row"},h("h2",{style:"margin:0"},q.title),h("span",{class:"sp"}),h("a",{class:"btn sm",href:"#/edit/"+id},"Edit")),
      h("div",{class:"card stack",style:"background:var(--yellow)"},h("strong",{},"Your share link"),h("input",{type:"text",readonly:"",value:link(id),onfocus:e=>e.target.select(),"aria-label":"Share link"}),h("div",{class:"row"},h("button",{class:"btn dark",onclick:()=>share(id,q.title)},"Share"),h("a",{class:"btn",href:"#/q/"+id},"Preview as a player"))),
      h("div",{class:"grid"},h("div",{class:"card"},h("p",{class:"muted",style:"margin:0"},"Players"),h("div",{class:"bigscore",style:"font-size:3rem"},rs.length)),h("div",{class:"card"},h("p",{class:"muted",style:"margin:0"},"Average score"),h("div",{class:"bigscore",style:"font-size:3rem"},avg+"/"+q.questions.length))),
      h("div",{class:"card"},h("h3",{},"Leaderboard"),rs.length?h("table",{},...rs.slice(0,50).map((r,k)=>h("tr",{},h("td",{},k+1),h("td",{},r.name),h("td",{style:"text-align:right;font-weight:600"},r.score+"/"+r.total)))):h("p",{class:"muted"},"No one has played yet. Share your link to get started.")),
      rs.length>0&&h("div",{class:"card stack"},h("h3",{},"Which questions fooled people?"),...q.questions.map((qu,k)=>{const c=rs.filter(r=>r.answers?.[k]===qu.correct).length,p=Math.round(c/rs.length*100);return h("div",{},h("div",{class:"row"},h("span",{},qu.text),h("span",{class:"sp"}),h("strong",{},p+"%")),h("div",{class:"bar2"},h("i",{style:"width:"+p+"%"})))}))));
  }catch(e){fail(e)}
